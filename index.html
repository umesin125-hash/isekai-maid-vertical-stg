 ctx.fillStyle='#514e77';ctx.strokeStyle='#dabd8e';ctx.lineWidth=3.5;ctx.beginPath();for(let i=0;i<8;i++){let a=i*TAU/8+Math.PI/8,rr=i%2?rad*.72:rad*.84;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.stroke();
 magicRing(0,0,rad*.62,-clock*.76,'#f9d098',.86,9);
 ctx.fillStyle=gradient(0,0,rad*.59,'#fff4fa','#a74df1');ctx.beginPath();ctx.arc(0,0,rad*.43,0,TAU);ctx.fill();ctx.shadowBlur=23;ctx.shadowColor='#f6d9ff';ctx.fillStyle='#fbedff';ctx.beginPath();ctx.arc(0,0,rad*.2,0,TAU);ctx.fill();ctx.restore();}
function drawEnemy(e){switch(e.type){case 'bat':drawBat(e);break;case 'wisp':drawWisp(e);break;case 'drone':drawDrone(e);break;case 'golem':drawGolem(e);break;case 'elite':drawElite(e);break;default:drawBoss(e);}}
function drawPlayer(){if(!player)return;const p=player,c=roster[selected],x=p.x,y=p.y;
 ctx.save();if(p.inv>0&&p.entry<=0&&Math.floor(clock*15)%3===0)ctx.globalAlpha=.45;
 // aura, rotating sigil, floating quantum particles
 let rad=67+3*Math.sin(clock*3.5);ctx.fillStyle=gradient(x,y,rad,hexAlpha(c.color,.31),hexAlpha(c.color,0));ctx.beginPath();ctx.arc(x,y,rad,0,TAU);ctx.fill();
 magicRing(x,y+9,68,clock*.22,c.light,.51,12);magicRing(x,y+9,54,-clock*.15,c.color,.57,8);
 // draw a 6x4 animated sprite for Aristea, or prepared rear pose for Milia/Kanato
 if(selected===0){const img=assets.aristea;if(img&&img.complete&&img.naturalWidth){let row=(Math.abs(p.vx)>7)?(p.vx<0?1:2):0;let f=Math.floor(clock*7)%6;if(p.shots%6<3&&row===0&&p.entry<=0)row=3;ctx.drawImage(img,f*122,row*163,122,163,x-61,y-104,122,163);}}
 else imgDraw(c.kind,x-61,y-104,122,163);
 // quantum silver sparks around body
 for(let j=0;j<5;j++){let q=clock*1.1+j*TAU/5,r=28+7*Math.sin(clock*1.3+j);spark(x+Math.cos(q)*r,y+Math.sin(q)*r,2.3,'#ecfaff',.8);}
 // rainbow hit point at center
 let hue=(clock*150)%360;ctx.shadowBlur=13;ctx.shadowColor=`hsl(${hue},100%,68%)`;ctx.fillStyle=`hsl(${hue},100%,65%)`;ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.stroke();ctx.restore();
}
function drawShot(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(-b.vx,-b.vy));const c=roster[b.owner];if(b.owner===0){ctx.shadowColor='#fff3b5';ctx.shadowBlur=16;ctx.fillStyle='#fff4bd';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(8,-6);ctx.lineTo(6,16);ctx.lineTo(0,23);ctx.lineTo(-6,16);ctx.lineTo(-8,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(3,-4);ctx.lineTo(1,18);ctx.lineTo(-2,18);ctx.lineTo(-3,-4);ctx.fill();}
 if(b.owner===1){let k=Math.max(.47,1-b.trav/900);ctx.scale(k,k);ctx.shadowBlur=13;ctx.shadowColor='#7cdbff';ctx.strokeStyle='#95eaff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-5,25,-Math.PI*.94,Math.PI*.22);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(0,-5,25,-Math.PI*.94,Math.PI*.22);ctx.stroke();}
 if(b.owner===2){ctx.shadowColor='#ff9da8';ctx.shadowBlur=13;ctx.fillStyle='#ff777f';ctx.beginPath();ctx.ellipse(0,0,4,11,0,0,TAU);ctx.fill();ctx.fillStyle='#fff5f6';ctx.beginPath();ctx.ellipse(0,-3,1.7,7,0,0,TAU);ctx.fill();}
 ctx.restore();}
function drawEnemyShot(b){ctx.save();ctx.shadowColor=b.c;ctx.shadowBlur=10;ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(b.x,b.y,b.r*.9,b.r*1.3,Math.atan2(b.vy,b.vx)-Math.PI/2,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.34,0,TAU);ctx.fill();ctx.restore();}
function drawItem(v){ctx.save();ctx.translate(v.x,v.y);ctx.rotate(v.t*.9);ctx.shadowBlur=15;ctx.shadowColor=v.type==='power'?'#ffdb6c':'#90e3ff';ctx.strokeStyle=v.type==='power'?'#ffe5a0':'#b1ebff';ctx.fillStyle=v.type==='power'?'#b88b21':'#2c70c1';ctx.lineWidth=2.6;ctx.beginPath();for(let i=0;i<4;i++){let a=i*TAU/4;ctx.lineTo(Math.cos(a)*18,Math.sin(a)*18);}ctx.closePath();ctx.fill();ctx.stroke();ctx.rotate(-v.t*.9);text(v.type==='power'?'P':'B',0,0,18,'#fff','center','bold','sans');ctx.restore();}
function drawFx(){for(const e of effects){const k=1-e.life/e.max;ctx.save();ctx.globalAlpha=Math.max(0,e.life/e.max);if(e.type==='burst'){let r=e.size*k+.5;ctx.fillStyle=gradient(e.x,e.y,r*1.5,hexAlpha(e.color,.45),hexAlpha(e.color,0));ctx.beginPath();ctx.arc(e.x,e.y,r*1.5,0,TAU);ctx.fill();ctx.strokeStyle=e.color;ctx.lineWidth=3*(1-k);ctx.beginPath();ctx.arc(e.x,e.y,r,0,TAU);ctx.stroke();}ctx.restore();}
 for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/q.max);spark(q.x,q.y,q.size,q.color);}ctx.globalAlpha=1;
 for(const v of texts){ctx.globalAlpha=Math.max(0,v.life);text(v.s,v.x,v.y,v.size,v.c,'center','bold','sans','#1c1440');}ctx.globalAlpha=1;}
function drawHUD(){ctx.save();let g=ctx.createLinearGradient(0,0,0,TOP);g.addColorStop(0,'rgba(7,8,30,.93)');g.addColorStop(1,'rgba(18,21,59,.76)');ctx.fillStyle=g;ctx.fillRect(0,0,W,TOP);line(8,TOP,532,TOP,'#c5a56c',2);
 frame(0,0,W,TOP+7);text(roster[selected].name,72,29,24,'#ffe3b1','left','bold');text('SCORE',288,24,15,'#cfc3de');text(String(Math.floor(score)).padStart(8,'0'),288,51,24,'#fff0d8','center','bold');text(`GRAZE ${String(graze).padStart(5,'0')}`,288,78,16,'#d9ddff');text(phase==='wave2'?'STAGE 1-2':phase==='boss'?'STAGE 1-BOSS':'STAGE 1-1',468,29,16,'#ffdfaa');text('NORMAL',468,55,17,'#e9d7f3');
 rounded(15,99,154,30,6,'rgba(7,12,40,.72)','rgba(255,226,165,.57)');text(`♥ ×${player.lives}   POWER ${player.power}/5`,92,114,17,'#ffe4c0','center','bold','sans');
 // bottom control bar
 let bg=ctx.createLinearGradient(0,856,0,H);bg.addColorStop(0,'rgba(11,10,45,.58)');bg.addColorStop(1,'rgba(8,8,28,.93)');ctx.fillStyle=bg;ctx.fillRect(0,856,W,104);line(0,856,W,856,'#c0a26d',1.5);
 text('QUANTUM RESONANCE',26,883,14,'#eeddb2','left','bold');rounded(27,906,277,18,6,'#1b1b3e','#c6a56b');const pw=(player.power/5)*273;rounded(29,908,Math.max(4,pw),14,4,gradient(40,914,260,roster[selected].color,roster[selected].light));text(`PWR ${player.power}/5`,166,939,14,'#f8f0d0');
 button(370,874,139,68,`BOMB ×${player.bombs}`,'#fff8df',true);
 rounded(474,105,56,46,9,'rgba(8,12,45,.68)','#d1b87b');text('Ⅱ',502,128,26,'#fff0bd','center','bold','sans');
 ctx.restore();}
function drawBossHP(){if(!boss||!enemies.includes(boss))return;const b=boss;panel(39,151,462,55);const name=b.type==='boss'?'魔導兵器 エーテリオン':'中ボス・古代守護機';text(name,W/2,165,19,'#fff1bf','center','bold');rounded(56,182,428,13,5,'#230e3b','#cab081');rounded(58,184,Math.max(2,424*(b.hp/b.maxHp)),9,5,b.type==='boss'?'#d96ddb':'#e5b35c');}
function drawStageMessage(){if(stageMessage<=0)return;const a=Math.min(1,stageMessage/.6,(3.2-stageMessage)/.4);ctx.save();ctx.globalAlpha=clamp(a,0,1);rounded(33,330,474,105,14,'rgba(11,12,44,.79)','#e0c383',2);text(phase==='wave1'?'STAGE 1-1':phase==='midboss'?'MID BOSS':phase==='wave2'?'STAGE 1-2':'WARNING',W/2,361,29,'#fff1cd','center','bold');text(phase==='wave1'?'蒼天の遺跡':phase==='midboss'?'古代守護機 接近':phase==='wave2'?'量子共鳴領域':'巨大魔導兵器 出現',W/2,400,19,'#e9d9f7');ctx.restore();}
function playScene(){sky('play');ctx.save();if(shake>0)ctx.translate(rand(-shake*4,shake*4),rand(-shake*4,shake*4));
 for(const v of items)drawItem(v);
 for(const e of enemies)drawEnemy(e);
 for(const b of bullets)drawShot(b);
 for(const b of enemyShots)drawEnemyShot(b);
 drawPlayer();drawFx();ctx.restore();
 if(bombVisual>0){ctx.save();const pct=1-bombVisual/1.1;let r=pct*900;ctx.strokeStyle=`rgba(255,242,199,${bombVisual*.6})`;ctx.lineWidth=14;ctx.beginPath();ctx.arc(player.x,player.y,r,0,TAU);ctx.stroke();ctx.fillStyle=`rgba(248,235,255,${bombVisual*.13})`;ctx.fillRect(0,0,W,H);ctx.restore();}
 drawHUD();drawBossHP();drawStageMessage();
 if(stageTime<8){ctx.save();ctx.globalAlpha=Math.max(0,1-stageTime/8);text('指でなぞって移動・ショットは自動',W/2,810,16,'#fcefc3','center','bold','sans','#1b163f');ctx.restore();}
}
function clearScene(){sky('title');frame(0,0,W,H);magicRing(W/2,370,165,clock*.15,'#f0d29b',.7);text('STAGE CLEAR',W/2,296,43,'#ffe7b3','center','bold','sans','#120e2f');text('蒼天の遺跡 - 試作版 完走！',W/2,367,24,'#e9e1ff');text(`SCORE  ${String(Math.floor(score)).padStart(8,'0')}`,W/2,437,30,'#fff9e0');text(`GRAZE  ${graze}`,W/2,479,24,'#e6d6ef');text(`${roster[selected].name}  POWER ${player.power}/5`,W/2,522,23,roster[selected].nameColor);button(86,670,368,78,'もう一度遊ぶ','#fff5c2',true);button(111,774,318,67,'キャラクター選択');}
function overScene(){sky('play');frame(0,0,W,H);ctx.fillStyle='rgba(11,11,35,.48)';ctx.fillRect(0,0,W,H);text('GAME OVER',W/2,342,48,'#ffbdb9','center','bold','sans','#24112b');text(`SCORE  ${String(Math.floor(score)).padStart(8,'0')}`,W/2,428,30,'#fff0d6');text(`POWER ${player.power}/5   GRAZE ${graze}`,W/2,481,22,'#e8dbec');button(89,632,362,75,'リトライ','#fff3ba',true);button(109,734,322,68,'キャラクター選択');}
function pauseScene(){playScene();ctx.fillStyle='rgba(8,9,35,.72)';ctx.fillRect(0,0,W,H);panel(49,289,442,339,true);text('PAUSE',W/2,355,48,'#fff1cb','center','bold');button(110,423,320,64,'ゲームに戻る','#fff5ca',true);button(110,511,320,64,'キャラ選択へ');}
function draw(){ctx.clearRect(0,0,W,H);if(scene==='title')titleScene();else if(scene==='select')selectScene();else if(scene==='play')playScene();else if(scene==='pause')pauseScene();else if(scene==='over')overScene();else if(scene==='clear')clearScene();}
function mapPoint(ev){const rect=canvas.getBoundingClientRect();return {x:clamp((ev.clientX-rect.left)*W/rect.width,0,W),y:clamp((ev.clientY-rect.top)*H/rect.height,0,H)};}
function hit(x,y,rx,ry,rw,rh){return x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh;}
function chooseStageAction(q){const {x,y}=q;
 if(scene==='title'){scene='select';sound('select');return;}
 else if(scene==='select'){
  if(hit(x,y,18,210,504,377)){selected=clamp(Math.floor((x-18)/174),0,2);sound('select');return;}
  if(hit(x,y,72,750,390,121)){resetGame();sound('start');return;}
 }else if(scene==='play'){
  if(hit(x,y,463,95,77,69)){scene='pause';pointer=null;return;}
  if(y>857&&x>350){bomb();return;}
  // aim touch causes delta movement instead of teleport
  pointer={startX:x,startY:y,startPlayerX:player.x,startPlayerY:player.y,x,y,drag:true};return;
 }else if(scene==='pause'){
  if(y>410&&y<497){scene='play';sound('select');}
  else if(y>500&&y<591){scene='select';sound('select');}
 }else if(scene==='clear'){
  if(y>650&&y<764){resetGame();sound('start');}
  else if(y>768&&y<856){scene='select';sound('select');}
 }else if(scene==='over'){
  if(y>610&&y<718){resetGame();sound('start');}
  else if(y>724&&y<830){scene='select';sound('select');}
 }
}
canvas.addEventListener('pointerdown',ev=>{ev.preventDefault();unlockSound();canvas.setPointerCapture(ev.pointerId);chooseStageAction(mapPoint(ev));},{passive:false});
canvas.addEventListener('pointermove',ev=>{ev.preventDefault();if(pointer&&pointer.drag&&scene==='play'){const q=mapPoint(ev);pointer.x=q.x;pointer.y=q.y;}},{passive:false});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,ev=>{pointer=null;});
window.addEventListener('keydown',ev=>{
 const key=ev.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(key))ev.preventDefault();keyState.add(key);unlockSound();
 if((key==='Enter'||key==='Space')&&scene==='title')scene='select';
 else if((key==='Enter'||key==='Space')&&scene==='select')resetGame();
 else if(key==='Escape'||key==='KeyP'){if(scene==='play')scene='pause';else if(scene==='pause')scene='play';}
 else if(key==='KeyB'||key==='KeyX'){if(scene==='play')bomb();}
 else if(scene==='select'&&['ArrowLeft','ArrowRight'].includes(key)){selected=(selected+(key==='ArrowRight'?1:2))%3;}
 else if(scene==='over'&&key==='KeyR')resetGame();
});
window.addEventListener('keyup',ev=>keyState.delete(ev.code));
window.addEventListener('blur',()=>{pointer=null;keyState.clear();if(scene==='play')scene='pause';});

// All music and SFX are original WebAudio oscillator tones; no external audio requests.
function unlockSound(){if(!soundOn||ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();musicNext=ac.currentTime+.12;}catch(err){soundOn=false;}}
function tone(freq,dur=.11,type='sine',gain=.04,delay=0){if(!ac||ac.state==='suspended'||!soundOn)return;let t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.011);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+dur+.01);}
function sound(type){if(!ac||!soundOn)return;const notes={select:[587,880],start:[440,660,988],item:[704,880,1056],bomb:[220,330,440],hit:[180,130]};if(notes[type])notes[type].forEach((n,i)=>tone(n,.13,'triangle',type==='bomb'?.055:.035,i*.065));}
const tune=[0,4,7,11,7,4,2,7,0,4,9,12,11,9,7,4];
function musicTick(){if(!ac||!soundOn||ac.state==='suspended')return;if(scene==='pause')return;if(musicNext<ac.currentTime-.3)musicNext=ac.currentTime+.04;while(musicNext<ac.currentTime+.14){const n=tune[musicIndex%tune.length],idx=musicIndex%tune.length;const base=scene==='title'||scene==='select'?261.625:220;tone(base*2**(n/12),.21,'sine',.008,musicNext-ac.currentTime);if(idx%4===0)tone(base*.5*2**(n/12),.48,'triangle',.009,musicNext-ac.currentTime);musicNext+=.27;musicIndex++;}}
function loop(now){const dt=clamp((now-last)/1000,0,.038);last=now;update(dt);draw();musicTick();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
